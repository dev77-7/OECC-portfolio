# /etc/nginx/sites-available/oecc.conf
# Static site for OECC. setup-ec2.sh installs this and swaps in your domain.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root /var/www/oecc;
    index index.html;
    server_tokens off;
    charset utf-8;

    include /etc/nginx/snippets/oecc-headers.conf;

    # ---- compression ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json text/plain application/xml;

    # Never serve dotfiles or the deploy kit (listed first: regex locations match in order).
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }

    # ---- caching ----
    # nginx drops server-level add_header lines inside a location that sets its own,
    # so each location below re-includes the security headers.

    # HTML, CSS and JS: browsers revalidate on every visit (a cheap 304 when unchanged),
    # so content edits show up straight after a deploy.
    location ~* \.(html|css|js|webmanifest)$ {
        include /etc/nginx/snippets/oecc-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Images, fonts and video: 30 days. Give a replacement file a new name.
    location ~* \.(woff2|jpg|jpeg|png|webp|avif|svg|ico|mp4|webm)$ {
        include /etc/nginx/snippets/oecc-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
