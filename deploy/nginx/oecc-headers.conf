# /etc/nginx/snippets/oecc-headers.conf — security headers for the OECC site.
# Everything is self-hosted; Google Forms (iframe in the contact dialog) is the only third party.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; frame-src https://docs.google.com; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# Turn on once HTTPS works for every hostname (setup-ec2.sh does this after certbot succeeds):
# add_header Strict-Transport-Security "max-age=31536000" always;
